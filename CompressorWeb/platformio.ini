; ============================================================================
; PROJETO: EnergizAR - Sistema de Automação e Monitoramento ESP32
; ARQUIVO: platformio.ini
; ============================================================================

[platformio]
; Define o upload via USB como padrão (mude para esp32dev_ota se preferir)
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do Monitor Serial e Upload
monitor_speed = 115200
upload_speed = 921600

; Filtros do Monitor Serial
monitor_filters =
    esp32_exception_decoder
    time

; Tabela de partições para OTA com mais espaço de código:
;   - app0 (OTA_0): ~1,87 MB (1.966.080 bytes)
;   - app1 (OTA_1): ~1,87 MB (1.966.080 bytes)
;   - spiffs:        128 KB   (131.072 bytes - suficiente para redes Wi-Fi)
board_build.partitions = min_spiffs.csv

; Dependências do projeto
lib_deps =
    arduino-libraries/NTPClient@^3.2.1
    https://github.com/mathieucarbou/AsyncTCP.git
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    adafruit/Adafruit BusIO@^1.16.1

; Flags de compilação
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ASYNCWEBSERVER_REGEX

; ============================================================================
; AMBIENTE DE UPLOAD SEM FIO (OTA via ArduinoOTA / PlatformIO)
; ============================================================================
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; Coloque o IP do ESP32 conectado no seu roteador (ou 192.168.26.7 se estiver no AP dele)
upload_port = 192.168.26.7
upload_flags =
    --port=3232
    ; --auth=SUA_SENHA_OTA  ; Descomente se configurar ArduinoOTA.setPassword("...")